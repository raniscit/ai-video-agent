[project]
name = "ai-video-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivangi Maurya", email = "mauryashivangi007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "deep-translator>=1.11.4",
    "ffmpeg-python>=0.2.0",
    "fpdf2>=2.7.9",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "openai-whisper>=20240930",
    "pydantic>=2.7.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.38.0",
    "torch>=2.2.0",
    "yt-dlp>=2024.8.6",
]

[project.scripts]
ai-video-agent = "ai_video_agent:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
